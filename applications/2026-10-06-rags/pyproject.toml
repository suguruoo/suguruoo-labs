[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamodb-rag-poc"
version = "0.1.0"
description = "DynamoDB RAG PoC - 4 independent pipeline comparison"
requires-python = ">=3.13"
dependencies = [
    "sentence-transformers>=3.3",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-community>=0.3",
    "langchain-qdrant>=0.2",
    "openai>=1.50",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "streamlit>=1.40",
    "psycopg2-binary>=2.9",
    "pgvector>=0.3",
    "pymysql>=1.1",
    "qdrant-client>=1.11",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "tiktoken>=0.8",
    "httpx>=0.27",
    "pypdf>=5.0",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["data*", "pipeline*", "api*", "ui*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true
